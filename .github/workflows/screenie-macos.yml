name: Screenie macOS build

on:
  push:
    paths:
      - "screenie/macos/**"
      - ".github/workflows/screenie-macos.yml"
  pull_request:
    paths:
      - "screenie/macos/**"
  workflow_dispatch:

permissions:
  contents: write  # to publish the download release

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: sw_vers && swift --version
      - name: Build Screenie.app
        working-directory: screenie/macos
        run: ./build.sh
      - name: Package Screenie.dmg
        working-directory: screenie/macos/build
        run: |
          rm -rf dmg Screenie.dmg
          mkdir dmg
          cp -R Screenie.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname Screenie -srcfolder dmg -ov -format UDZO Screenie.dmg
      - name: Screenshots of each style
        continue-on-error: true  # a rendering hiccup on the runner shouldn't block the download
        working-directory: screenie/macos/build
        run: |
          mkdir -p snapshots
          for style in aurora starfield farm black; do
            Screenie.app/Contents/MacOS/Screenie --snapshot "$style" 40 "snapshots/$style.png"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: Screenie-snapshots
          path: screenie/macos/build/snapshots
      - uses: actions/upload-artifact@v4
        with:
          name: Screenie-macOS-arm64
          path: screenie/macos/build/Screenie.dmg
      # A fixed download link that always has the newest build:
      # https://github.com/<owner>/<repo>/releases/download/screenie-macos-latest/Screenie.dmg
      - name: Publish download release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: screenie-macos-latest
        run: |
          shopt -s nullglob  # screenshots are optional
          files=(screenie/macos/build/Screenie.dmg screenie/macos/build/snapshots/*.png)
          gh release delete "$TAG" --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          gh release create "$TAG" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Screenie for macOS (latest build)" \
            --notes "Apple Silicon, macOS 14 or newer. Built from ${GITHUB_REF_NAME} at ${GITHUB_SHA::7}. Open the disk image and drag Screenie to Applications. It isn't notarized, so the first time macOS says it can't be opened: click Done, then open System Settings > Privacy & Security and click Open Anyway."
